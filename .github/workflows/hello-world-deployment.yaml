name: Hello World - Build & Release
run-name: Hello World deployment triggered by ${{ github.actor }}.
on:
  push:
    branches:
      - "deployment"
    paths:
      - "hello-world/**"
      - "Helm/hello-world/**"
      - ".github/workflows/hello-world-release.yaml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push image to GHCR
        run: |
          docker build ./hello-world -t ghcr.io/${{ secrets.GHCR_USERNAME }}/hello-world:${{ github.sha }}
          docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/hello-world:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.EKS_CLUSTER_REGION }}

      - name: Connect to EKS Cluster
        run: aws eks update-kubeconfig --region ${{ secrets.EKS_CLUSTER_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Deploy with Helm
        run: |
          helm upgrade --install hello-world ./Helm/hello-world \
            --namespace default \
            --set image.repository=ghcr.io/${{ secrets.GHCR_USERNAME }}/hello-world \
            --set image.tag=${{ github.sha }} \
            --set image.pullPolicy=Always \
            --wait
